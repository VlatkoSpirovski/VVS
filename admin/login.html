<!doctype html>
<html lang="mk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VVS Admin – Најава</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap">
    <link rel="stylesheet" href="/admin/admin.css">
  </head>
  <body class="adm">
    <main class="adm-login">
      <div class="adm-login__stack">
        <form id="loginForm" class="adm-login__card" novalidate>
          <div class="adm-login__brand">
            <img src="/assets/vvs-auto-logo.jpeg" alt="" width="44" height="44">
            <span><strong>VVS Auto</strong><small>Админ</small></span>
          </div>
          <h1>Најава</h1>
          <div class="adm-field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required autofocus></div>
          <div class="adm-field"><label for="password">Лозинка</label><input id="password" type="password" autocomplete="current-password" required></div>
          <p id="loginError" class="adm-form-error" role="alert"></p>
          <button class="adm-btn adm-btn--primary adm-btn--block" type="submit" id="loginButton">Најави се</button>
        </form>
        <a class="adm-login__back" href="/mk/">← Назад на веб-страницата</a>
      </div>
    </main>
    <script src="/admin/login.js"></script>
  </body>
</html>
