<!doctype html>
<html lang="mk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VVS Admin</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="admin-body">
    <main class="admin-app">
      <aside class="admin-sidebar">
        <img class="footer-logo" src="/assets/vvs-auto-logo.jpeg" alt="VVS Auto logo">
        <nav>
          <a href="#dashboard">Dashboard</a>
          <a href="#vehicles">Возила</a>
          <a href="/mk/">Public MK</a>
          <a href="/en/">Public EN</a>
        </nav>
        <button class="button ghost" id="logoutButton" type="button">Log out</button>
      </aside>

      <div class="admin-main">
        <header class="admin-top">
          <div><p class="eyebrow">VVS Admin</p><h1>Управување со возила</h1></div>
          <div class="button-row"><button class="button dark" id="addVehicleButton" type="button">+ Додади возило</button></div>
        </header>

        <section id="dashboard" class="admin-cards"></section>

        <section id="vehicles" class="admin-panel">
          <div class="admin-panel__head"><div><p class="eyebrow">Inventory</p><h2>Возила</h2></div></div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead><tr><th>Фото</th><th>Возило</th><th>Година</th><th>Гориво</th><th>Километража</th><th>Објавено</th><th>Акции</th></tr></thead>
              <tbody id="vehicleRows"></tbody>
            </table>
          </div>
        </section>

        <section class="admin-panel" id="editorPanel" hidden>
          <div class="admin-panel__head"><div><p class="eyebrow">Vehicle editor</p><h2 id="editorTitle">Додади возило</h2></div></div>
          <form id="vehicleForm" class="admin-form">
            <input type="hidden" id="vehicleId">
            <input type="hidden" id="slug">
            <input type="hidden" id="stockNumber">
            <input type="hidden" id="price">
            <input type="hidden" id="currency" value="EUR">
            <input type="hidden" id="status" value="published">

            <div class="static-car-form">
              <section class="form-card fixed-fields-card">
                <p class="eyebrow">Фиксни полиња</p>
                <h3>Спецификација</h3>
                <div class="admin-form-grid">
                  <div class="field"><label for="brand">Марка</label><input id="brand" required></div>
                  <div class="field"><label for="model">Модел</label><input id="model" required></div>
                  <div class="field"><label for="year">Година</label><input id="year" type="number"></div>
                  <div class="field"><label for="fuel">Гориво</label><input id="fuel"></div>
                  <div class="field"><label for="mileage">Километри</label><input id="mileage" type="number"></div>
                  <div class="field"><label for="transmission">Менувач</label><input id="transmission"></div>
                  <div class="field"><label for="bodyType">Каросерија</label><input id="bodyType"></div>
                  <div class="field"><label for="exteriorColor">Боја</label><input id="exteriorColor"></div>
                  <div class="field"><label for="registration">Регистрација</label><input id="registration"></div>
                  <div class="field"><label for="registeredUntil">Регистрирана до</label><input id="registeredUntil" placeholder="09.2026"></div>
                  <div class="field"><label for="power">Сила на моторот</label><input id="power" placeholder="81 kw / 110 ks"></div>
                  <div class="field"><label for="emissionClass">Класа на емисија</label><input id="emissionClass" placeholder="Euro 5"></div>
                </div>
              </section>

              <section class="form-card">
                <p class="eyebrow">Превод</p>
                <h3>Опис на возило</h3>
                <div class="translation-stack">
                  <div class="field"><label for="descriptionMk">Македонски</label><textarea id="descriptionMk" rows="5"></textarea></div>
                  <div class="field"><label for="descriptionSq">Shqip</label><textarea id="descriptionSq" rows="5"></textarea></div>
                  <div class="field"><label for="descriptionEn">English</label><textarea id="descriptionEn" rows="5"></textarea></div>
                </div>
              </section>

              <section class="form-card">
                <p class="eyebrow">Фотографии</p>
                <h3>Слики</h3>
                <label class="upload-zone" for="photoUpload">Upload vehicle images<input id="photoUpload" type="file" accept="image/*" multiple hidden></label>
                <div class="photo-admin-grid" id="photoPreview"></div>
              </section>

              <section class="form-card publish-card">
                <p class="eyebrow">Објава</p>
                <label class="check-field"><input id="published" type="checkbox" checked> Објавено на веб</label>
                <label class="check-field"><input id="featured" type="checkbox"> Издвоено на почетна</label>
              </section>
            </div>

            <div class="button-row"><button class="button dark" type="submit">Save vehicle</button><button class="button ghost" id="cancelEditButton" type="button">Cancel</button></div>
          </form>
        </section>
      </div>
    </main>
    <script src="/data.js"></script>
    <script src="/admin/admin.js"></script>
  </body>
</html>
