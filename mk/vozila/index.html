      <section class="section"><div class="container inventory-layout"><aside class="filters"><div class="field"><label for="vehicleSearch" data-i18n="search">Пребарување</label><input id="vehicleSearch" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="BMW, SUV, stock број"></div><div class="field"><label for="brandFilter" data-i18n="brand">Марка</label><select id="brandFilter"></select></div><div class="field"><label for="fuelFilter" data-i18n="fuel">Гориво</label><select id="fuelFilter"></select></div><div class="field"><label for="statusFilter" data-i18n="status">Статус</label><select id="statusFilter"></select></div><a class="button dark" data-href="contact" data-i18n="inquire" href="/mk/kontakt/">Испрати барање</a></aside><div><div class="inventory-top"><strong id="vehicleCount">0 возила</strong><div class="field"><label for="sortVehicles" data-i18n="sort">Сортирање</label><select id="sortVehicles"><option value="newest" data-i18n="newest">Најнови</option><option value="price-asc" data-i18n="priceAsc">Цена — најниска</option><option value="price-desc" data-i18n="priceDesc">Цена — највисока</option><option value="mileage" data-i18n="mileageAsc">Најмала километража</option><option value="year-desc" data-i18n="yearDesc">Година — најнова</option></select></div></div><div class="vehicle-grid" id="inventoryGrid"></div></div></div></section>
